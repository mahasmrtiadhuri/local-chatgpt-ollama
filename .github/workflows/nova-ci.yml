name: NOVA research tests
on:
  push:
    branches:
      - nova-continual-learning
  pull_request:
    paths:
      - 'research/nova/**'
      - '.github/workflows/nova-ci.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e './research/nova[dev]' --no-deps
          python -m pip install pytest
      - name: Run NOVA tests
        working-directory: research/nova
        run: pytest
